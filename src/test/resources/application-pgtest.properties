# Profile for the PostgreSQL integration tests ONLY (run with: mvnw test -Ppgtest).
# The URL is written out literally - it deliberately does NOT read INVOICE_DB_URL, which may point at
# the live database. PgTestDatabaseGuard additionally checks "SELECT current_database()" before
# Hibernate touches the schema, and stops the test run if it is not exactly the test database.
spring.datasource.url=jdbc:postgresql://localhost:5432/Actify-Internship-Invoice-Process_test_db
spring.datasource.username=${INVOICE_TEST_DB_USERNAME:postgres}
# Empty -> the PostgreSQL driver uses pgpass.conf, like the main application.
spring.datasource.password=${INVOICE_TEST_DB_PASSWORD:}

# The ONLY place where Hibernate may change a schema: the isolated test database. SchemaSafetyGuard allows
# "update" only for profile pgtest + this exact URL; the main application uses "validate".
spring.jpa.hibernate.ddl-auto=update

# Test-only signing key (Base64 of a fixed, public, non-secret text). Never used outside the test database.
invoice.jwt.secret=cGd0ZXN0LW9ubHkta2V5LW5vdC1hLXJlYWwtc2VjcmV0LTAxMjM=

# No live Gemini call is possible from a test: no key, and an address that goes nowhere.
# (The extractor is also replaced by a Mockito mock in every integration test.)
gemini.api-key=
gemini.base-url=http://127.0.0.1:9/no-live-gemini-in-tests

# TEST-ONLY pacing numbers so the (directly called) worker may run against the mocked extractor. They are
# deliberately huge and are NOT real Gemini limits; real values come from AI Studio (see QuotaSettings).
gemini.limits.rpm=100000
gemini.limits.tpm=1000000000
gemini.limits.rpd=10000000
gemini.limits.initial-token-estimate=1000
# Lift the production 15-per-minute ceiling and switch off even pacing so the tests can drain queues quickly and
# never depend on wall-clock spacing. Pacing has its own tests (QuotaSettingsTest, QuotaPgIntegrationTest).
gemini.limits.business-max-rpm=100000
gemini.limits.even-pacing=false
# The background @Scheduled worker stays off in tests; tests call ExtractionWorker.processNextJob() themselves.
invoice.worker.enabled=false

# invoice.storage.dir is set per test run to a temporary folder under target/ (see AbstractPgIntegrationTest).
