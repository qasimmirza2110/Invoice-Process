<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Invoice Extraction Workspace</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">

<main class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Invoice Extraction Workspace</h1>
    <p class="subtitle">Sign in with the account your administrator created for you.</p>

    <!-- method=post: even if a click happens before login.js is ready, the password never goes into a URL. -->
    <form id="login-form" class="login-form" method="post" action="login.html" novalidate>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="username" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>

        <p class="login-error" id="login-error" role="alert" hidden></p>

        <button type="submit" class="btn btn--primary" id="login-btn">Sign in</button>
    </form>

    <p class="meta login-note">Local demo application. Your session ends after 30 minutes.</p>
</main>

<script src="js/session.js"></script>
<script src="js/login.js"></script>
</body>
</html>
