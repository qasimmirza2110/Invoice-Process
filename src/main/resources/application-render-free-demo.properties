# TEMPORARY FREE DEMO profile for a Render Free Web Service + Render Free Postgres (docs/RENDER_DEPLOYMENT.md, part A).
# Purpose: let a frontend developer integrate against the real API with SYNTHETIC data only. NOT production.
#
# Activated ONLY by SPRING_PROFILES_ACTIVE=render-free-demo (exactly this one profile). RenderFreeDemoGuard refuses the
# start - before any database connection - when anything below is overridden into an unsafe state (environment
# variables win over this file, so the guard checks the effective values, not these lines).
#
# Deliberately different from the production profile "render": no persistent disk, no Gemini, synthetic accounts only.
# Never copy values from here into application-render.properties.

# Read by RenderFreeDemoGuard: proves this file was really loaded together with the profile.
invoice.free-demo.profile-file-loaded=true

# ---------- Web server (same as the render profile) ----------
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# ---------- Database: still guarded ----------
# JDBC URL without credentials (INVOICE_DB_USERNAME / INVOICE_DB_PASSWORD hold them). SchemaSafetyGuard still requires
# INVOICE_LIVE_START_APPROVED=true and INVOICE_APPROVED_DATABASE=host:port/database naming exactly this database,
# and ddl-auto stays "validate": the schema comes from docs/sql/invoice-process-bootstrap-schema.sql.
spring.datasource.url=${INVOICE_DB_URL}

# ---------- PDFs: EPHEMERAL on purpose ----------
# A Free web service has no persistent disk; its filesystem is wiped on every restart, redeploy and spin-down.
# The folder name says so. RenderFreeDemoGuard refuses any other location (and never accepts /var/data).
invoice.storage.dir=/tmp/invoice-demo-documents-EPHEMERAL
# The write probe still runs; it proves the folder is writable, NOT that anything persists.
invoice.storage.verify-on-startup=true

# ---------- Uploads: ONLY the published synthetic fixtures ----------
# SHA-256 of docs/react-handoff/demo-fixtures/synthetic-demo-invoice-01.pdf ... -06.pdf (FreeDemoUploadPolicy). Any
# other file is rejected with 422 NOT_A_DEMO_FIXTURE before it is stored. FreeDemoFixtureTest keeps this list and the
# committed files identical. Never add the hash of a real document here.
invoice.free-demo.allowed-upload-sha256=\
  85a802e3f35521ac1ee674e5cc807f9f43cbd62716ba8586c15135d0ea05a323,\
  82a4a2ae9865fd6aedc2b56d52e7da717e5e6dc574fd13987a2300efd547e8a8,\
  7349c8f1b36e9ee83e7c72ad3ad115d6b240dbba9c8196c50a4c7e5f14d50b48,\
  c9ff1a24d689f640ad206b32a51b579298b5b26e5c72c43ae30b5cec17ce889d,\
  1d512ef83cb382ecb5d06cb2e13ba7ae81fb0cf5c3d2ea0417870a86045f89d6,\
  dab0741ba7cb98d7fb2aac5875b71cadb9852f32668144692a2df022b73bf563

# ---------- Security: identical to production ----------
invoice.auth.cookie-secure=true
# A throw-away INVOICE_JWT_SECRET is still mandatory (no random key fallback).
invoice.jwt.allow-ephemeral-secret=false

# ---------- No AI, no background processing, no cloud import ----------
invoice.worker.enabled=false
invoice.legacy-extract.enabled=false
gemini.api-key=
# Belt and braces: even a call that slipped through would go nowhere.
gemini.base-url=http://127.0.0.1:9/no-gemini-in-free-demo
