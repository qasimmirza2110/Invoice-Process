# Local demo profile. It is the DEFAULT profile (spring.profiles.default in application.properties): a plain
# "Run As > Java Application" in Eclipse uses it, and so does -Dspring.profiles.active=localdemo.
# Everything not set here comes from application.properties. SchemaSafetyGuard refuses this profile unless
# every rule below still holds after environment variables and -D options are applied.

# A separate, disposable database on this computer - never the live or the test database. Written out literally:
# it deliberately does NOT read INVOICE_DB_URL. Username/password still come from INVOICE_DB_USERNAME /
# INVOICE_DB_PASSWORD or pgpass.conf.
spring.datasource.url=jdbc:postgresql://localhost:5432/invoice_process_local_demo_db

# Never changes the schema. The demo database gets its schema from a reviewed script before the first start.
spring.jpa.hibernate.ddl-auto=validate

# By default no real Gemini call is possible: no key and no worker, so uploads stay QUEUED ("waiting for extraction").
# Opt-in for ONE local extraction test (all set in the launch configuration, never in a file):
#   INVOICE_LOCALDEMO_GEMINI_ENABLED=true, GEMINI_API_KEY, GEMINI_MODEL, GEMINI_LIMIT_RPM / _TPM / _RPD (whole numbers),
#   GEMINI_INITIAL_TOKEN_ESTIMATE, INVOICE_WORKER_ENABLED=true and INVOICE_WORKER_ONLY_INVOICE_IDS=<synthetic invoice id>.
#   SchemaSafetyGuard refuses any other mix, and the key is only ever sent to the official endpoint from
#   application.properties (no base-url override is accepted).
invoice.localdemo.gemini-enabled=${INVOICE_LOCALDEMO_GEMINI_ENABLED:false}
gemini.api-key=
invoice.worker.enabled=false
# The legacy single-file extraction (POST /api/invoices/extract) would call Gemini for any file outside the worker's
# allowlist, so the local demo never offers it. Vendors upload; the worker extracts.
invoice.legacy-extract.enabled=false

# Without INVOICE_JWT_SECRET (a plain Eclipse run) a random login-signing key is made for this run only; everyone logs
# in again after a restart. A configured INVOICE_JWT_SECRET is always used as-is (and must still be valid).
invoice.jwt.allow-ephemeral-secret=true

# Demo PDFs are kept apart from any other document folder.
invoice.storage.dir=${INVOICE_STORAGE_DIR:${user.home}/invoice-process-localdemo-documents}
