# Container profile for a Render Web Service (docs/RENDER_DEPLOYMENT.md). Activated ONLY by
# SPRING_PROFILES_ACTIVE=render in the service environment; local runs never load this file.
# Everything not set here comes from application.properties. Values are names of environment variables only -
# never put a real password, key or secret into this file.
#
# SchemaSafetyGuard treats "render" like any other non-demo profile: the start is refused before any database
# connection unless INVOICE_LIVE_START_APPROVED=true AND INVOICE_APPROVED_DATABASE=host:port/database names exactly
# the database in INVOICE_DB_URL. ddl-auto stays "validate": the schema is created/migrated by reviewed SQL, never
# by the application.

# ---------- Web server ----------
# Render routes traffic to the port in $PORT and needs the server on all container interfaces (not 127.0.0.1).
server.address=0.0.0.0
server.port=${PORT:10000}
# Render terminates TLS at its proxy. "native" lets Tomcat honour X-Forwarded-Proto / X-Forwarded-For, but only when
# the connection comes from an internal (private-network) proxy address (Tomcat RemoteIpValve defaults), so a client
# cannot spoof them directly. Effect: request.isSecure() is true behind HTTPS and
# the login limiter sees the client address instead of the proxy's. Verify after the first deploy (guide, section 9).
server.forward-headers-strategy=native
# On a deploy/restart Render sends SIGTERM: finish in-flight HTTP requests before the JVM stops.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# ---------- Required configuration (no local defaults: a missing value stops the start) ----------
# JDBC form without credentials, e.g. for Neon (DIRECT endpoint, not "-pooler"):
#   jdbc:postgresql://ep-xxxx.<region>.aws.neon.tech/<database>?sslmode=require
# (credentials go in INVOICE_DB_USERNAME / INVOICE_DB_PASSWORD). Never localhost, never a developer's own database.
spring.datasource.url=${INVOICE_DB_URL}

# ---------- Connection pool for a free, scale-to-zero database (Neon Free) ----------
# Small pool, and NO idle connections kept open: after 2 idle minutes every connection is closed, so the pool never
# holds the database awake and a suspended database simply wakes on the next query. Connections are renewed every
# 5 minutes, before a provider-side idle cut can leave a dead one in the pool. A cold database gets 15 s to accept a
# connection; after that the request fails (no endless retrying).
spring.datasource.hikari.maximum-pool-size=${INVOICE_DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
# Every JPA query is cancelled after 30 s instead of holding a connection forever.
spring.jpa.properties.javax.persistence.query.timeout=30000

# ---------- Original PDFs: private remote bucket ONLY ----------
# The container's own disk is wiped on every deploy, restart and (Free plan) spin-down, so uploads go to the private
# S3-compatible bucket configured by INVOICE_S3_ENDPOINT / _REGION / _BUCKET / _ACCESS_KEY_ID / _SECRET_ACCESS_KEY.
invoice.storage.type=s3
# Refuse to start unless the bucket accepts a write/read/delete probe with these credentials AND refuses anonymous
# reads; and refuse local storage altogether (StorageStartupCheck). There is no switch to accept ephemeral storage.
invoice.storage.verify-on-startup=true
invoice.storage.require-remote=true

# ---------- Security ----------
# A real INVOICE_JWT_SECRET is mandatory here; a random per-run key is a local-demo convenience only.
invoice.jwt.allow-ephemeral-secret=false

# ---------- Gemini / worker: OFF unless deliberately switched on ----------
# The worker stays off until INVOICE_WORKER_ENABLED=true AND GEMINI_API_KEY AND all GEMINI_LIMIT_* values are set AND
# INVOICE_GEMINI_PAID_TIER_CONFIRMED=true (the key belongs to a Google Cloud project with active billing; see
# application.properties). Without the confirmation queued invoices stay QUEUED - nothing is sent to Gemini.
invoice.worker.enabled=${INVOICE_WORKER_ENABLED:false}
# The legacy single-file extraction (POST /api/invoices/extract) is not part of the batch workflow. Off by default.
invoice.legacy-extract.enabled=${INVOICE_LEGACY_EXTRACT_ENABLED:false}
