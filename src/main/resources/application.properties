# Actify Invoice Process - API-only backend (no HTML pages are served; see docs/REACT_BACKEND_HANDOFF.md).
spring.application.name=actify-invoice-process
# A start WITHOUT any profile (Eclipse "Run As > Java Application", mvnw spring-boot:run) is the LOCAL DEMO:
# application-localdemo.properties is then loaded on top of this file and SchemaSafetyGuard applies its local-demo
# rules (only invoice_process_local_demo_db; no Gemini key and worker off unless INVOICE_LOCALDEMO_GEMINI_ENABLED=true
# opts in to a controlled test). Any explicit profile replaces this default;
# a start against an approved real database therefore uses e.g. -Dspring.profiles.active=live plus the approval
# variables below. Tests: pgtest sets its own profile; the offline @WebMvcTest tests never open a database.
spring.profiles.default=localdemo
server.port=8088
# Local demo: reachable only from this computer, never from the LAN. This is NOT TLS / production hardening.
# The container deployment overrides port and address in application-render.properties (docs/RENDER_DEPLOYMENT.md).
server.address=127.0.0.1

# ---------- PostgreSQL ----------
# INVOICE_ prefix so this project never picks up DB_PASSWORD etc. that belong to other projects.
spring.datasource.url=${INVOICE_DB_URL:jdbc:postgresql://localhost:5432/Actify-Internship-Invoice-Process_db}
spring.datasource.username=${INVOICE_DB_USERNAME:postgres}
# If INVOICE_DB_PASSWORD is not set, the PostgreSQL driver falls back to the user's pgpass.conf file.
spring.datasource.password=${INVOICE_DB_PASSWORD:}

# ---------- JPA / Hibernate ----------
# validate = check the schema, NEVER change it. New tables/columns are added with the reviewed SQL scripts
# in docs/sql after a restore-tested backup ("Gate L"). Only the guarded pgtest profile uses "update".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Only relevant where ddl-auto=update is used (the pgtest profile): Hibernate's default
# (DROP_RECREATE_QUIETLY) drops and re-adds every unique constraint on each start;
# RECREATE_QUIETLY only adds missing ones, so uk_invoice_versions_invoice_version is never dropped.
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY

# ---------- Startup safety (SchemaSafetyGuard) ----------
# Any start that is not the isolated pgtest run is refused BEFORE a database connection is made, unless the
# launch configuration sets INVOICE_LIVE_START_APPROVED=true AND names the one approved database as host:port/database
# (it must equal the endpoint in the JDBC URL). Both are set only inside an approved gate (scratch rehearsal or live).
invoice.live-start-approved=${INVOICE_LIVE_START_APPROVED:false}
invoice.approved-database=${INVOICE_APPROVED_DATABASE:}

# ---------- Login (JWT in an HttpOnly cookie) ----------
# Base64 of at least 32 random bytes, from the launch configuration only. The app refuses to start without it.
invoice.jwt.secret=${INVOICE_JWT_SECRET:}
invoice.jwt.ttl-minutes=30
# Secure cookie flag: always on for HTTPS requests; set true here as well once the app runs behind TLS.
invoice.auth.cookie-secure=${INVOICE_COOKIE_SECURE:false}
# First ADMIN, created once when no admin exists. Remove both from the launch configuration afterwards.
invoice.bootstrap.admin-email=${INVOICE_BOOTSTRAP_ADMIN_EMAIL:}
invoice.bootstrap.admin-password=${INVOICE_BOOTSTRAP_ADMIN_PASSWORD:}
# No in-memory demo user with a generated password: users live in app_users only.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---------- Original PDF storage ----------
# Private folder for the uploaded PDFs (never served directly; only via DocumentController after an access check).
# Must be an absolute path - the app refuses to start otherwise. Override with INVOICE_STORAGE_DIR.
# The default folder name keeps the earlier project label ("task8") ON PURPOSE: existing invoice_documents rows point
# at PDFs in this folder, so renaming it would make every stored original unreadable (404). Rename it only together
# with a verified move of the files (copy, compare SHA-256 per document, then switch INVOICE_STORAGE_DIR).
invoice.storage.dir=${INVOICE_STORAGE_DIR:${user.home}/actify-task8-invoice-documents}

# ---------- File upload ----------
# Gemini accepts inline request payloads up to ~20 MB; base64 adds ~33%, so 10 MB of PDF is a safe cap.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---------- Google Drive / OneDrive pickers (browser side; see CloudSourceSettings) ----------
# Public browser values only - no client secret exists. Empty = GET /api/cloud-sources reports NOT_CONFIGURED.
# The pickers download the chosen PDFs in the browser and send them through the normal upload endpoint, so every
# cloud file gets the same PDF / size / duplicate checks. live-tested=true only after an approved real test.
invoice.cloud.google.client-id=${INVOICE_GOOGLE_CLIENT_ID:}
invoice.cloud.google.api-key=${INVOICE_GOOGLE_API_KEY:}
invoice.cloud.google.app-id=${INVOICE_GOOGLE_APP_ID:}
invoice.cloud.google.live-tested=${INVOICE_GOOGLE_LIVE_TESTED:false}
# PERSONAL (consumer OneDrive) or WORK_OR_SCHOOL (OneDrive for Business) - the owner decides.
invoice.cloud.onedrive.account-type=${INVOICE_ONEDRIVE_ACCOUNT_TYPE:}
invoice.cloud.onedrive.client-id=${INVOICE_ONEDRIVE_CLIENT_ID:}
invoice.cloud.onedrive.tenant-id=${INVOICE_ONEDRIVE_TENANT_ID:}
invoice.cloud.onedrive.sharepoint-base-url=${INVOICE_ONEDRIVE_SHAREPOINT_BASE_URL:}
invoice.cloud.onedrive.live-tested=${INVOICE_ONEDRIVE_LIVE_TESTED:false}

# ---------- Gemini (free tier only) ----------
# The key only ever comes from the environment. Empty default so the app still starts
# without it; the extract endpoint then returns a clear 502 instead of crashing at boot.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
# POST /api/invoices/extract (legacy single-file extraction, ADMIN only). The local demo switches it off.
invoice.legacy-extract.enabled=true

# ---------- Gemini pacing (shared by the queue worker and the legacy /extract endpoint) ----------
# Copy the limits of YOUR project + model from Google AI Studio. No defaults on purpose: the worker stays OFF
# until all four are valid. Google counts per project, so other users of the project are invisible to this app;
# the safety margin keeps some headroom for them. The daily quota resets at midnight Pacific time.
gemini.limits.rpm=${GEMINI_LIMIT_RPM:}
gemini.limits.tpm=${GEMINI_LIMIT_TPM:}
gemini.limits.rpd=${GEMINI_LIMIT_RPD:}
gemini.limits.initial-token-estimate=${GEMINI_INITIAL_TOKEN_ESTIMATE:}
gemini.limits.safety-margin=0.8
# The project's own ceiling: never more than 15 requests per minute, even if AI Studio allows more (the effective
# limit is the lower of the two). Calls are also spaced evenly: with 15 x 0.8 = 12 calls a minute, one every 5 s.
gemini.limits.business-max-rpm=15

# ---------- Extraction queue worker ----------
# Off by default. Even when true, it only runs when the gemini.limits.* values above are valid.
invoice.worker.enabled=${INVOICE_WORKER_ENABLED:false}
invoice.worker.poll-interval-ms=2000
invoice.worker.max-attempts=3
invoice.worker.stale-claim-minutes=10
# Optional comma-separated invoice ids: when set, the worker claims ONLY these invoices and leaves every other queued
# job untouched (a controlled test of one synthetic invoice). Required by the local demo whenever its worker runs.
invoice.worker.only-invoice-ids=${INVOICE_WORKER_ONLY_INVOICE_IDS:}

# ---------- Logging ----------
# RestTemplate at DEBUG would log the whole request body (the base64 PDF). Keep it quiet.
logging.level.org.springframework.web.client.RestTemplate=INFO
